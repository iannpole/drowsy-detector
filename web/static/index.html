<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drowsy Monitor</title>
<style>
:root{color-scheme:dark;--panel:#151d2d;--border:#27344c;--muted:#94a3b8}
*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh;background:radial-gradient(circle at top,#172554,#080c16 55%);color:#f8fafc;padding:24px}
main{width:min(1080px,100%);margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.header h1{margin:0;font-size:26px}.header p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:18px}.panel{background:rgba(21,29,45,.94);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 16px 40px #0005}
.wrap{position:relative;width:100%;aspect-ratio:4/3;background:#020617;border-radius:12px;overflow:hidden}video,canvas#overlay{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
#badge{font-size:32px;font-weight:800;padding:18px;border-radius:12px;text-align:center;letter-spacing:.06em;color:#07111f;transition:.2s}.alert{background:#22c55e}.distracted{background:#facc15}.drowsy{background:#ef4444}.idle{background:#475569;color:#fff}
.controls{display:grid;gap:10px;margin-top:14px}button{border:0;border-radius:10px;font-size:15px;font-weight:700;padding:12px 16px;background:#2563eb;color:#fff;cursor:pointer}button:hover:not(:disabled){filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}#stop{background:#dc2626}
#msg{min-height:48px;color:var(--muted);font-size:14px;padding:12px;background:#0b1220;border-radius:10px;margin-top:12px}.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.readouts div{background:#0b1220;padding:12px;border-radius:10px;color:var(--muted);font-size:12px}.readouts b{display:block;color:#fff;font-size:23px;margin-top:3px}
.chart-panel{grid-column:1/-1}#chart{width:100%;height:180px;background:#0b1220;border-radius:12px}.chart-title{margin:0 0 10px;font-size:15px;color:var(--muted)}
@media(max-width:760px){body{padding:12px}.grid{grid-template-columns:1fr}.header{align-items:flex-start}.header p{font-size:13px}}
</style>
</head>
<body>
<main>
  <header class="header"><div><h1>Pemantau Kantuk</h1><p>Analisis wajah lokal — video tidak dikirim ke server</p></div></header>
  <section class="grid">
    <div class="panel">
      <div class="wrap"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>
    </div>
    <aside class="panel">
      <div id="badge" class="idle">BELUM AKTIF</div>
      <div class="controls">
        <button id="calibrate">Kalibrasi (10 detik)</button>
        <button id="start" disabled>Mulai Pemantauan</button>
        <button id="stop" disabled>Hentikan</button>
      </div>
      <div id="msg">Lakukan kalibrasi untuk memulai.</div>
      <div class="readouts">
        <div>EAR<b id="r-ear">-</b></div>
        <div>PERCLOS<b id="r-perclos">-</b></div>
        <div>Sudut naik/turun<b id="r-pitch">-</b></div>
        <div>Sudut kiri/kanan<b id="r-yaw">-</b></div>
        <div>Jumlah kedipan<b id="r-blinks">0</b></div>
      </div>
    </aside>
    <div class="panel chart-panel"><p class="chart-title">Riwayat EAR — 30 detik terakhir</p><canvas id="chart" width="1000" height="180"></canvas></div>
  </section>
</main>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), octx = overlay.getContext("2d");
const chart = $("chart"), cctx = chart.getContext("2d");
const LEFT_EYE = [362, 385, 387, 263, 373, 380];
const RIGHT_EYE = [33, 160, 158, 133, 153, 144];
const WINDOW_SEC = 3, CHART_SEC = 30, SEND_EVERY_FRAME = true, CALIB_SEC = 10, ALARM_AFTER_MS = 2000, BLINK_MAX_MS = 400;

let landmarker = null, stream = null, lastVideoTime = -1;
let calibrating = false, calibStart = 0, calibSamples = [], baseline = null;
let buf = [], history = [], blinks = 0, wasClosed = false, lastFrameEar = 0;
let monitoring = false, socket = null, latest = null, lastDetect = null;
let drowsySince = null, lastBeep = 0, audioCtx = null, animationStarted = false;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pt = (lm, i, w, h) => ({ x: lm[i].x * w, y: lm[i].y * h });
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const std = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))); };
const msg = t => { $("msg").textContent = t; };

function ear(lm, idx, w, h) {
  const p = idx.map(i => pt(lm, i, w, h));
  const horiz = 2 * dist(p[0], p[3]);
  return horiz === 0 ? 0 : (dist(p[1], p[5]) + dist(p[2], p[4])) / horiz;
}

function mar(lm, w, h) {
  const width = dist(pt(lm, 78, w, h), pt(lm, 308, w, h));
  return width ? dist(pt(lm, 13, w, h), pt(lm, 14, w, h)) / width : 0;
}

function headPose(matrix) {
  const d = matrix.data;
  const r = [[d[0], d[1], d[2]], [d[4], d[5], d[6]], [d[8], d[9], d[10]]];
  const rad = 180 / Math.PI;
  const pitch = Math.atan2(r[2][1], r[2][2]) * rad;
  const yaw = Math.atan2(-r[2][0], Math.hypot(r[2][1], r[2][2])) * rad;
  return { pitch, yaw };
}

function perclosTime() {
  const closedThr = baseline * 0.7;
  let closedMs = 0, start = null;
  const addSegment = end => {
    if (end - start >= BLINK_MAX_MS) closedMs += end - start;
    start = null;
  };
  buf.forEach(s => {
    const c = s.ear < closedThr;
    if (c && start === null) start = s.t;
    if (!c && start !== null) addSegment(s.t);
  });
  if (start !== null) addSegment(buf[buf.length - 1].t);
  return Math.min(closedMs / (WINDOW_SEC * 1000), 1);
}

function windowFeatures() {
  const ears = buf.map(s => s.ear);
  const closedThr = baseline * 0.7;
  const closed = ears.map(e => e < closedThr);
  const span = Math.max(buf[buf.length - 1].t - buf[0].t, 1e-9) / 1000;
  let count = 0, longest = 0, start = null;
  closed.forEach((c, i) => {
    if (c && i > 0 && !closed[i - 1]) count++;
    if (c && start === null) start = buf[i].t;
    if (!c && start !== null) { longest = Math.max(longest, (buf[i].t - start) / 1000); start = null; }
  });
  if (start !== null) longest = Math.max(longest, (buf[buf.length - 1].t - start) / 1000);
  const pitches = buf.map(s => s.pitch), yaws = buf.map(s => s.yaw), mars = buf.map(s => s.mar);
  const earMean = mean(ears);
  return {
    ear_mean: earMean, ear_std: std(ears), ear_norm: earMean / baseline,
    mar_mean: mean(mars), perclos: perclosTime(),
    blink_rate: count * 60 / span, max_closed_sec: longest,
    pitch_mean: mean(pitches), pitch_std: std(pitches), yaw_mean: mean(yaws), yaw_std: std(yaws),
  };
}

function drawChart(now) {
  const w = chart.width, h = chart.height, maxEar = 0.5;
  cctx.clearRect(0, 0, w, h);
  if (baseline !== null) {
    const y = h - (baseline * 0.7 / maxEar) * h;
    cctx.strokeStyle = "#f87171"; cctx.setLineDash([4, 4]);
    cctx.beginPath(); cctx.moveTo(0, y); cctx.lineTo(w, y); cctx.stroke(); cctx.setLineDash([]);
  }
  cctx.strokeStyle = "#60a5fa"; cctx.beginPath();
  history.forEach((s, i) => {
    const x = w - ((now - s.t) / (CHART_SEC * 1000)) * w;
    const y = h - Math.min(s.ear / maxEar, 1) * h;
    i ? cctx.lineTo(x, y) : cctx.moveTo(x, y);
  });
  cctx.stroke();
}

function drawOverlay(lm) {
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.fillStyle = "#4ade80";
  [...LEFT_EYE, ...RIGHT_EYE].forEach(i => {
    const p = pt(lm, i, overlay.width, overlay.height);
    octx.beginPath(); octx.arc(p.x, p.y, 3, 0, Math.PI * 2); octx.fill();
  });
}

function beep() {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.value = 880; gain.gain.value = 0.3;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

function setStatus(status) {
  const badge = $("badge");
  const labels = { alert: "WASPADA", distracted: "TERGANGGU", drowsy: "KANTUK" };
  badge.className = status in labels ? status : "idle";
  badge.textContent = labels[status] || "BELUM AKTIF";
  const now = performance.now();
  if (status === "drowsy") {
    drowsySince ??= now;
    if (now - drowsySince > ALARM_AFTER_MS && now - lastBeep > 1000 && audioCtx) { beep(); lastBeep = now; }
  } else {
    drowsySince = null;
  }
}

function onFrame(now) {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return requestAnimationFrame(onFrame);
  lastVideoTime = video.currentTime;
  const result = landmarker.detectForVideo(video, now);
  const lm = result.faceLandmarks[0];
  if (lm) {
    const w = video.videoWidth, h = video.videoHeight;
    drawOverlay(lm);
    const e = (ear(lm, LEFT_EYE, w, h) + ear(lm, RIGHT_EYE, w, h)) / 2;
    const m = mar(lm, w, h);
    const pose = result.facialTransformationMatrixes?.[0] ? headPose(result.facialTransformationMatrixes[0]) : { pitch: 0, yaw: 0 };
    lastDetect = { ear: e, mar: m, pitch: pose.pitch, yaw: pose.yaw };
    lastFrameEar = e;
    $("r-ear").textContent = e.toFixed(3);
    $("r-pitch").textContent = pose.pitch.toFixed(1);
    $("r-yaw").textContent = pose.yaw.toFixed(1);

    if (calibrating) {
      calibSamples.push(e);
      const left = Math.max(0, CALIB_SEC - (now - calibStart) / 1000);
      msg(`Kalibrasi: mata terbuka, lihat lurus ke depan (${left.toFixed(1)} detik)`);
      if (left === 0) finishCalibration();
    }
    if (monitoring && baseline !== null) {
      buf.push({ t: now, ear: e, mar: m, pitch: pose.pitch, yaw: pose.yaw });
      buf = buf.filter(s => now - s.t <= WINDOW_SEC * 1000);
      const closed = e < baseline * 0.7;
      if (closed && !wasClosed) blinks++;
      wasClosed = closed;
      $("r-blinks").textContent = blinks;
      
      const closedMs = buf.reduce((sum, s, i) => {
        if (i === 0) return 0;
        if (s.ear < baseline * 0.7 && buf[i-1].ear < baseline * 0.7) return sum + (s.t - buf[i-1].t);
        return sum;
      }, 0);
      $("r-perclos").textContent = (closedMs / (WINDOW_SEC * 1000)).toFixed(2);
      
      if (SEND_EVERY_FRAME) sendFrame();
      history.push({ t: now, ear: e });
    }
  }
  history = history.filter(s => now - s.t <= CHART_SEC * 1000);
  drawChart(now);
  requestAnimationFrame(onFrame);
}

function finishCalibration() {
  calibrating = false;
  baseline = calibSamples.length ? [...calibSamples].sort((a, b) => a - b)[Math.floor(calibSamples.length / 2)] : null;
  if (baseline === null) { msg("Wajah tidak terdeteksi saat kalibrasi. Silakan ulangi."); return; }
  $("r-perclos").textContent = "-";
  $("start").disabled = false;
  msg(`Kalibrasi berhasil! Baseline EAR = ${baseline.toFixed(3)}. Silakan klik "Mulai Pemantauan".`);
}

async function startCamera() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
  video.srcObject = stream;
  await video.play();
}

async function loadLandmarker() {
  if (landmarker) return;
  msg("Memuat model MediaPipe...");
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm");
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: "/model/face_landmarker.task" },
    runningMode: "VIDEO", numFaces: 1, outputFacialTransformationMatrixes: true,
  });
}

$("calibrate").onclick = async () => {
  try {
    msg("Meminta akses kamera...");
    await startCamera();
    await loadLandmarker();
  } catch (err) {
    msg(`Gagal: ${err.message}. Pastikan membuka via localhost dan izin kamera diberikan.`);
    return;
  }
  calibSamples = []; baseline = null; calibrating = true; calibStart = performance.now();
  $("start").disabled = true;
  audioCtx ??= new AudioContext();
  if (!animationStarted) { animationStarted = true; requestAnimationFrame(onFrame); }
};

function sendFrame() {
  if (!socket || socket.readyState !== WebSocket.OPEN || !lastDetect || !baseline) return;
  const closedThr = baseline * 0.7;
  const instant_perclos = lastDetect.ear < closedThr ? 1 : 0;
  socket.send(JSON.stringify({
    ear: lastDetect.ear,
    perclos: instant_perclos,
    yaw_mean: lastDetect.yaw,
    pitch_mean: lastDetect.pitch,
    baseline: baseline,
    mar_mean: lastDetect.mar
  }));
}

$("start").onclick = () => {
  monitoring = true; buf = []; history = []; blinks = 0; wasClosed = false;
  $("start").disabled = true; $("stop").disabled = false;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(`${proto}://${location.host}/ws`);
  socket.onopen = () => { msg("Terhubung ke server. Deteksi real-time dimulai..."); };
  socket.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.error) return msg(`Server: ${data.error}`);
    setStatus(data.status);
    if (data.confidence !== null) msg(`${data.model} | kepercayaan ${(data.confidence * 100).toFixed(0)}%`);
    else msg(`Metode: ${data.model}`);
  };
  socket.onclose = () => { if (monitoring) msg("Koneksi terputus."); };
};

$("stop").onclick = () => {
  monitoring = false;
  socket?.close();
  socket = null;
  drowsySince = null;
  setStatus("idle");
  $("start").disabled = false; $("stop").disabled = true;
  msg("Pemantauan dihentikan. Klik 'Kalibrasi' untuk memulai ulang.");
};
</script>
</body>
</html>
